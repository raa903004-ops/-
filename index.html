/* Mina Planner visual refresh — Sakura dashboard */
.shell{grid-template-columns:206px minmax(0,1fr)}
.sidebar{padding:19px 12px;background:linear-gradient(180deg,#fffdfd 0%,#fcf6ff 55%,#f5e8fa 100%);overflow:hidden}
.sidebar:after{content:"🌸";font-size:140px;position:absolute;bottom:25px;left:-32px;opacity:.20;pointer-events:none;transform:rotate(-20deg)}
.dark .sidebar{background:linear-gradient(180deg,#262131,#282137 55%,#332841)}
.brand{font-size:17px;letter-spacing:-.8px;margin:4px 8px 26px;white-space:nowrap;position:relative;z-index:1}

.nav{position:relative;z-index:1}

.search-shell kbd{font-size:10px;border:1px solid var(--line);border-radius:5px;padding:3px 6px;white-space:nowrap}
.topbar-tools{display:flex;align-items:center;gap:15px}
.topbar-tools .iconbtn{font-size:20px;color:var(--text)}
.avatar{border:2px solid #edc8db;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;background:var(--pink);font-size:23px}
.dashboard-hero{min-height:178px;position:relative;overflow:hidden;background:linear-gradient(110deg,#fbecf8 0%,#f5e7fc 48%,#efdfef 100%);border:1px solid #f0dff0;border-radius:17px;padding:20px 24px 68px;margin-bottom:12px}
.dark .dashboard-hero{background:linear-gradient(110deg,#3b2e46,#41354e)}
.dashboard-hero h1{font-size:27px;letter-spacing:-1.3px;margin:0 0 6px;color:var(--text)}
.dashboard-hero p{font-size:12px;color:#70657a;line-height:1.6;margin:0;position:relative;z-index:2}
.dark .dashboard-hero p{color:#e0d2e8}
.hero-art{position:absolute;right:9px;top:-38px;height:210px;min-width:39%;display:flex;align-items:center;justify-content:center;pointer-events:none}
.hero-art:before{content:"";height:200px;width:250px;background:radial-gradient(ellipse at 50% 65%,#e0b5c9 0%,transparent 68%);position:absolute}
.hero-cat{font-size:100px;filter:drop-shadow(0 12px 10px #bc98ab55);position:relative;transform:rotate(-7deg);z-index:1}
.hero-books{font-size:75px;position:absolute;right:2px;top:78px;filter:drop-shadow(0 8px 6px #95759144)}
.hero-sparkles{position:absolute;left:12px;top:35px;font-size:65px;opacity:.6}
.hero-stats{position:absolute;left:12px;right:12px;bottom:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:9px;z-index:2}
.hero-stat{border-radius:10px;background:#fffdfddd;backdrop-filter:blur(7px);padding:10px 12px;display:flex;align-items:center;gap:11px;min-width:0}
.dark .hero-stat{background:#383244e0}
.hero-stat:nth-child(1){background:#ffebf4e8}.hero-stat:nth-child(2){background:#f2edffe8}.hero-stat:nth-child(3){background:#fff0f2e8}.hero-stat:nth-child(4){background:#e8f2ffe8}
.dark .hero-stat:nth-child(n){background:#41374be8}
.hero-stat i{font-size:19px;color:var(--accent);flex-shrink:0}
.hero-stat label{display:block;font-size:10px;color:#635b6b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-stat strong{display:block;font-size:13px;margin-top:2px;color:#242334}
.dark .hero-stat label,.dark .hero-stat strong{color:var(--text)}
.dash-columns{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(270px,.95fr);gap:12px;margin-bottom:12px}
.dash-bottom{display:grid;grid-template-columns:1.06fr 1.06fr 1fr;gap:12px;margin-bottom:12px}

.dash-panel{padding:14px 15px;border-radius:15px;box-shadow:0 2px 12px #6f58700a;min-width:0}
.dash-panel .panelhead{margin-bottom:10px}

.dash-panel h2 i{color:var(--accent);font-size:18px}

.dash-panel .item:last-child{border-bottom:0}
.dash-panel .item .name{font-size:11px;line-height:1.35}
.dash-panel .item .meta{font-size:10px}
.dash-panel .pill{font-size:9px;padding:5px 8px;white-space:nowrap}
.dash-week-toolbar{display:flex;align-items:center;gap:8px}

.timeline{display:grid;grid-template-columns:37px repeat(7,minmax(72px,1fr));min-width:620px;position:relative}
.timeline-day{font-size:11px;text-align:center;min-height:41px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:5px 0}
.timeline-day strong{display:block}.timeline-day span{font-size:9px;color:var(--muted)}
.timeline-day.highlight{background:var(--pink)}
.timeline-hour{font-size:9px;color:var(--muted);height:39px;display:flex;justify-content:center;align-items:flex-start;padding-top:3px}
.timeline-cell{border-left:1px solid var(--line);border-top:1px solid var(--line);height:39px;min-width:0;position:relative}
.timeline-event{font-size:9px;line-height:1.4;background:var(--blue);border:1px solid #cde0f8;border-radius:5px;padding:4px;overflow:hidden;position:absolute;top:0;left:2px;right:2px;z-index:2;min-height:30px;color:#334158}
.timeline-event.school{background:#e3efff;border-color:#cae0ff}.timeline-event.homework{background:#fbe4f0;border-color:#f3cce0}.timeline-event.olympiad{background:#eee6ff;border-color:#daccff}.timeline-event.project{background:#e1f4e8;border-color:#c8e6d4}.timeline-event.course{background:#fff3d5;border-color:#f4e2ad}.timeline-event.personal{background:#efedf3;border-color:#e0dce9}
.timeline-event strong{display:block;font-weight:700}
.timeline-note{font-size:10px;color:var(--muted);margin-top:9px}
.deadline-dot{color:var(--accent);font-size:17px}
.dash-task{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line);font-size:11px}
.dash-task:last-child{border-bottom:0}
.dash-task input{accent-color:var(--accent)}
.dash-task .text{flex:1;min-width:0;line-height:1.35}
.dash-task.completed .text{text-decoration:line-through;color:var(--muted)}
.smallmeta{font-size:9px;color:var(--muted);margin-top:3px}
.mini-stat{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:10px}
.mini-chart{height:65px;display:flex;align-items:end;gap:7px;margin-top:11px}
.mini-chart .mini-column{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:9px}
.mini-chart .mini-column i{display:block;width:100%;max-width:34px;background:linear-gradient(#e6a1df,#eae2ff);border-radius:4px 4px 0 0;min-height:4px}
.quick-types{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.quick-types button{border:0;border-radius:8px;background:var(--bg);padding:9px 4px;font-size:10px;font-weight:650;color:var(--text);white-space:nowrap}
.quick-types button.active{background:var(--pink);color:#9d477b}
.quick-types i{font-size:13px;vertical-align:-2px;margin-right:4px}
.quick-line{display:flex;gap:8px;margin-top:7px}
.quick-line select{width:33%}
.quick-line .btn{white-space:nowrap}
.dash-panel .empty{padding:18px 10px}
@media(max-width:1180px){.dash-bottom{grid-template-columns:repeat(2,minmax(0,1fr))}.dash-bottom>.panel:last-child{grid-column:1/-1}.dash-columns{grid-template-columns:1.5fr 1fr}}
@media(max-width:940px){.dash-columns,.dash-tail{grid-template-columns:1fr}.hero-stats{grid-template-columns:repeat(2,1fr)}.dashboard-hero{min-height:220px}.hero-art{right:0;top:-12px}.hero-cat{font-size:80px}.hero-books{font-size:55px}}
@media(max-width:800px){.sidebar{overflow-x:auto}.sidebar:after{display:none}.brand{margin:0 0 7px}.content{padding:11px}.topbar{padding:0;gap:9px}.topbar-tools{gap:6px}.topbar .search-shell{max-width:none}.topbar kbd{display:none}}

function analytics(){var completed=db.tasks.filter(t=>t.done).length,total=db.tasks.length,minutes=db.sessions.reduce((s,t)=>s+(Number(t.minutes)||0),0);var html='<div class="stats">';[['Задач всего',total],['Завершено',completed],['Время фокуса',minutes+' мин'],['Олимпиад',db.olympiads.length]].forEach(x=>html+='<div class="stat"><div class="value">'+esc(x[1])+'</div><div class="sub">'+x[0]+'</div></div>');html+='</div>';var cats=[...new Set(db.tasks.map(t=>t.category||'Другое'))];html+=panel('Задачи по категориям',cats.length?cats.map(c=>{var n=db.tasks.filter(t=>(t.category||'Другое')===c).length;return '<div class="barrow"><span>'+esc(c)+'</span><div class="chartbar"><span style="width:'+Math.round(n/Math.max(total,1)*100)+'%"></span></div><strong>'+n+'</strong></div>'}).join(''):empty('Добавь задачи, чтобы увидеть распределение'));var week=weekStart(today());html+='<div class="section-gap">'+panel('Выполнение за неделю',[0,1,2,3,4,5,6].map(i=>{var d=plus(week,i),a=db.tasks.filter(t=>t.date===d),n=a.filter(t=>t.done).length;return '<div class="barrow"><span>'+fmt(d,{weekday:'short',day:'numeric'})+'</span><div class="chartbar"><span style="width:'+(a.length?Math.round(n/a.length*100):0)+'%"></span></div><strong>'+n+'/'+a.length+'</strong></div>'}).join(''))+'</div>';return heading('Аналитика','Наглядный обзор учебной нагрузки и достижений')+html}

function render(){applyTheme();$('nav').innerHTML=sections.map(s=>'<button class="'+(view===s[0]?'active':'')+'" data-view="'+s[0]+'">'+icon(s[2])+' '+s[1]+'</button>').join('');$('root').innerHTML=({dashboard:dash,tasks:taskPage,calendar:calendarPage,olympiads:()=>records('olympiads'),courses:()=>records('courses'),projects:()=>records('projects'),notes:()=>records('notes'),goals:()=>records('goals'),focus:focusPage,analytics:analytics,settings:settings}[view]||dash)();bindDrag()}
function switchView(v){view=v;render();window.scrollTo(0,0)}
function makeModal(kind,id,preset){var cfg=configs[kind];if(!cfg)return;var item=id?db[kind].find(x=>x.id===id):null;var val=Object.assign({},preset||{},item||{});var body='<form id="recordForm"><div class="formgrid">'+cfg.fields.map(f=>{var v=val[f[0]]==null?'':val[f[0]],attrs='id="f_'+f[0]+'" name="'+f[0]+'" class="field" '+(f[3]?'required ':'');var input=f[2]==='textarea'?'<textarea '+attrs+' rows="4">'+esc(v)+'</textarea>':f[2]==='select'?'<select '+attrs+'>'+f[4].map(opt=>'<option '+(v===opt?'selected':'')+'>'+esc(opt)+'</option>').join('')+'</select>':'<input '+attrs+' type="'+f[2]+'" value="'+esc(v)+'" '+(f[2]==='number'?'min="0"':'')+'>';return '<label class="'+(f[2]==='textarea'?'wide':'')+'">'+f[1]+input+'</label>'}).join('')+'</div><div class="modalfoot"><button type="button" class="btn" data-action="close">Отмена</button><button class="btn primary" type="submit">Сохранить</button></div></form>';$('modalhost').innerHTML='<div class="modalback"><div class="modal" role="dialog" aria-modal="true"><h2>'+(id?'Изменить: ':'Новая запись: ')+esc(cfg.title)+'</h2>'+body+'</div></div>';$('recordForm').onsubmit=e=>{e.preventDefault();var record=Object.assign({},item||{id:uid()});new FormData(e.target).forEach((v,k)=>record[k]=String(v).trim());if(!record.title){toast('Укажи название');return}if(kind==='tasks')record.done=!!record.done;if(item){Object.assign(item,record)}else db[kind].push(record);save();closeModal();render();toast('Сохранено ✓')};setTimeout(()=>{var e=$('f_title');if(e)e.focus()},0)}
function closeModal(){$('modalhost').innerHTML=''}
function smart(){var raw=($('quickText')||{}).value||'';if(!raw.trim()){toast('Напиши, что нужно сделать');return}var lower=raw.toLowerCase(),months={'января':1,'февраля':2,'марта':3,'апреля':4,'мая':5,'июня':6,'июля':7,'августа':8,'сентября':9,'октября':10,'ноября':11,'декабря':12};var match=lower.match(/(?:до|на|к)\s+(\d{1,2})\s+(января|февраля|марта|апреля|мая|июня|июля|августа|сентября|октября|ноября|декабря)(?:\s+(\d{4}))?/);var deadline='';if(match){var year=Number(match[3]||today().slice(0,4)),candidate=year+'-'+String(months[match[2]]).padStart(2,'0')+'-'+String(match[1]).padStart(2,'0');if(!match[3]&&candidate<today())year++;deadline=year+'-'+String(months[match[2]]).padStart(2,'0')+'-'+String(match[1]).padStart(2,'0')}var reminder=lower.match(/напомни(?:ть)?\s+за\s+(\d+)\s+дн/);var category=/олимпиад|соревнован/.test(lower)?'Олимпиада':/домашн|дз|урок/.test(lower)?'Домашнее задание':/курс|лекци/.test(lower)?'Курс':/проект|исследован/.test(lower)?'Проект':'Школа';var name=raw.replace(/,?\s*напомни(?:ть)?\s+за\s+\d+\s+дн(?:я|ей|ь)?/i,'').trim();makeModal('tasks',null,{title:name,category:category,date:today(),deadline:deadline,reminder:reminder?reminder[1]:'',priority:'Средний'});toast('Проверь распознанные поля перед сохранением')}
function alerts(){var messages=[];db.tasks.filter(t=>!t.done&&t.deadline&&diff(t.deadline)<=Number(t.reminder||3)).forEach(t=>messages.push(t.title+' — '+prettyDeadline(t.deadline)));db.olympiads.filter(o=>o.regDeadline&&diff(o.regDeadline)<=3).forEach(o=>messages.push('Регистрация: '+o.title+' — '+prettyDeadline(o.regDeadline)));return messages}
function notifications(){var messages=alerts();if(!messages.length){toast('Ближайших напоминаний нет');return}alert('Напоминания Mina Planner:\n\n'+messages.slice(0,15).join('\n'))}
function exportData(){var blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='mina-planner-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
function bindDrag(){var dragged=null;document.querySelectorAll('[data-drag]').forEach(n=>{n.addEventListener('dragstart',()=>dragged=n.dataset.drag);n.addEventListener('dragover',e=>e.preventDefault());n.addEventListener('drop',e=>{e.preventDefault();var arr=db.tasks,a=arr.findIndex(x=>x.id===dragged),b=arr.findIndex(x=>x.id===n.dataset.drag);if(a<0||b<0)return;arr.splice(b,0,arr.splice(a,1)[0]);save();render()})});var wdrag=null;document.querySelectorAll('[data-widget]').forEach(n=>{n.addEventListener('dragstart',()=>wdrag=n.dataset.widget);n.addEventListener('dragover',e=>e.preventDefault());n.addEventListener('drop',e=>{e.preventDefault();var a=db.prefs.widgets.indexOf(wdrag),b=db.prefs.widgets.indexOf(n.dataset.widget);if(a<0||b<0)return;db.prefs.widgets.splice(b,0,db.prefs.widgets.splice(a,1)[0]);save();render()})})}
document.addEventListener('click',e=>{var el=e.target.closest('[data-view],[data-action],[data-check],[data-edit],[data-delete],[data-day],[data-color]');if(!el)return;if(el.dataset.view){switchView(el.dataset.view);return}if(el.dataset.day){selected=el.dataset.day;render();return}if(el.dataset.color){db.prefs.accent=el.dataset.color;save();render();return}if(el.dataset.check){var t=db.tasks.find(x=>x.id===el.dataset.check);if(t){t.done=!t.done;save();render()}return}if(el.dataset.edit){var x=el.dataset.edit.split(':');makeModal(x[0],x[1]);return}if(el.dataset.delete){var y=el.dataset.delete.split(':');if(confirm('Удалить запись?')){db[y[0]]=db[y[0]].filter(z=>z.id!==y[1]);save();render()}return}var action=el.dataset.action;if(!action)return;if(action.startsWith('view:'))switchView(action.slice(5));else if(action.startsWith('new:'))makeModal(action.slice(4),null,action==='new:tasks'?{date:selected}:action==='new:events'?{date:selected}:{});else if(action==='close')closeModal();else if(action==='quick')smart();else if(action==='notify')notifications();else if(action==='today'){selected=today();calMonth=selected.slice(0,7);render()}else if(action.startsWith('month:')){var n=Number(action.slice(6)),d=new Date(calMonth+'-01T12:00:00');d.setMonth(d.getMonth()+n);calMonth=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0')].join('-');render()}else if(action.startsWith('prep:')){var o=db.olympiads.find(t=>t.id===action.slice(5));if(o)makeModal('tasks',null,{title:'Подготовка: '+o.title,category:'Олимпиада',date:today(),deadline:o.date||'',details:'Олимпиада: '+o.title})}else if(action==='theme'){db.prefs.dark=!db.prefs.dark;save();render()}else if(action==='export')exportData();else if(action==='clear'){if(confirm('Удалить ВСЕ данные Mina Planner? Это нельзя отменить. Сначала сделай экспорт.')){db=JSON.parse(JSON.stringify(initial));save();render()}}else if(action==='notifications'){if(!('Notification' in window)){toast('Браузер не поддерживает уведомления');return}Notification.requestPermission().then(p=>{db.prefs.notifications=p==='granted';save();toast(p==='granted'?'Уведомления разрешены':'Разрешение не получено')})}else if(action==='focus:toggle'){focusRunning=!focusRunning;if(focusRunning){focusStart=Date.now();focusTotal=focusSeconds;focusTimer=setInterval(()=>{focusSeconds=Math.max(0,focusTotal-Math.floor((Date.now()-focusStart)/1000));var c=$('clock');if(c)c.textContent=String(Math.floor(focusSeconds/60)).padStart(2,'0')+':'+String(focusSeconds%60).padStart(2,'0');if(!focusSeconds){clearInterval(focusTimer);focusRunning=false;db.sessions.push({id:uid(),date:today(),minutes:25});save();toast('Фокус-сессия завершена! 🌷');if(db.prefs.notifications&&Notification.permission==='granted')new Notification('Mina Planner',{body:'25 минут фокуса завершены'});render()}},250)}else clearInterval(focusTimer);render()}else if(action==='focus:reset'){clearInterval(focusTimer);focusRunning=false;focusSeconds=1500;render()}else if(action==='focus:log'){db.sessions.push({id:uid(),date:today(),minutes:25});save();toast('25 минут записано');render()}});
document.addEventListener('change',e=>{if(e.target.id==='taskDate'){selected=e.target.value;render()}if(e.target.id==='importFile'){var f=e.target.files[0];if(!f)return;f.text().then(s=>{try{var o=JSON.parse(s);if(!o||!Array.isArray(o.tasks)||!Array.isArray(o.olympiads)){throw Error('Неподходящий файл')}if(!confirm('Заменить текущие данные резервной копией?'))return;db=Object.assign(JSON.parse(JSON.stringify(initial)),o);db.prefs=Object.assign({},initial.prefs,db.prefs||{});save();render();toast('Данные восстановлены')}catch(x){toast('Ошибка импорта: '+x.message)}})}});

var q=e.target.closest('[data-quickkind]');if(q){quickKind=q.dataset.quickkind;document.querySelectorAll('[data-quickkind]').forEach(x=>x.classList.toggle('active',x===q));return}
