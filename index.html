x;font-size:15px}.iconbtn:hover{color:var(--accent)}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.empty{color:var(--muted);padding:29px 15px;text-align:center;font-size:12px;border:1px dashed var(--line);border-radius:14px}.progress{height:8px;background:var(--line);border-radius:20px;overflow:hidden;margin-top:13px}.progress div{height:100%;background:var(--accent);transition:width .3s}.quick{display:flex;gap:9px;margin-top:15px}.field{background:var(--card);color:var(--text);border:1px solid var(--line);padding:11px 12px;border-radius:11px;min-width:0;width:100%;outline:none}textarea.field{min-height:110px;resize:vertical}.hint{font-size:11px;color:var(--muted);margin-top:9px;line-height:1.65}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.calendar .weekday{text-align:center;color:var(--muted);font-size:10px;font-weight:700;padding:8px}.day{height:45px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--text);font-size:12px;position:relative}.day:hover{background:var(--lav)}.day.selected{background:var(--accent);color:white}.day.current{border-color:var(--accent)}.day.has:after{content:'';width:5px;height:5px;border-radius:100%;background:#d777af;position:absolute;bottom:5px;left:calc(50% - 2px)}.day.selected:after{background:white}.cardgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(275px,1fr));gap:15px}.record{border:1px solid var(--line);border-radius:17px;padding:19px;background:var(--card);min-width:0}.record h3{font-size:15px;margin:9px 0}.record p{color:var(--muted);font-size:12px;line-height:1.65;overflow-wrap:anywhere}.record .row{justify-content:space-between}.section-gap{margin-top:20px}.banner{background:linear-gradient(105deg,var(--pink),var(--lav) 70%,var(--blue));padding:22px 27px;border-radius:21px;margin-bottom:20px}.banner h2{margin:0 0 7px;font-size:20px}.banner p{margin:0;color:#685c73;line-height:1.6;font-size:12px}.dark .banner p{color:var(--text)}.barr /* Mina Planner visual refresh — Sakura dashboard */
.shell{grid-template-columns:206px minmax(0,1fr)}
.sidebar{padding:19px 12px;background:linear-gradient(180deg,#fffdfd 0%,#fcf6ff 55%,#f5e8fa 100%);overflow:hidden}
.sidebar:after{content:"🌸";font-size:140px;position:absolute;bottom:25px;left:-32px;opacity:.20;pointer-events:none;transform:rotate(-20deg)}
.dark .sidebar{background:linear-gradient(180deg,#262131,#282137 55%,#332841)}
.brand{font-size:17px;letter-spacing:-.8px;margin:4px 8px 26px;white-space:nowrap;position:relative;z-index:1}
.brand:before{content:"୨୧";color:var(--accent);font-size:24px;margin-right:8px;vertical-align:-2px}
.nav{position:relative;z-index:1}
.nav button{padding:12px 13px;font-size:12px;font-weight:650}
.nav button.active{background:#f4e4fa}
.dark .nav button.active{background:#49384f}
.nav button i{color:var(--text)}
.bottom{position:relative;z-index:1;background:#fff9ffb8}
.content{padding:14px 18px 45px;max-width:1800px}
.topbar{height:48px;display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:12px;padding:0 14px 0 5px}
.search-shell{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;max-width:640px;width:100%;padding:0 13px;height:38px;box-shadow:0 2px 10px #53456908;color:var(--muted)}
.search-shell input{background:transparent;border:0;outline:none;width:100%;color:var(--text);font-size:12px}
.search-shell kbd{font-size:10px;border:1px solid var(--line);border-radius:5px;padding:3px 6px;white-space:nowrap}
.topbar-tools{display:flex;align-items:center;gap:15px}
.topbar-tools .iconbtn{font-size:20px;color:var(--text)}
.avatar{border:2px solid #edc8db;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;background:var(--pink);font-size:23px}
.dashboard-hero{min-height:178px;position:relative;overflow:hidden;background:linear-gradient(110deg,#fbecf8 0%,#f5e7fc 48%,#efdfef 100%);border:1px solid #f0dff0;border-radius:17px;padding:20px 24px 68px;margin-bottom:12px}
.dark .dashboard-hero{background:linear-gradient(110deg,#3b2e46,#41354e)}
.dashboard-hero h1{font-size:27px;letter-spacing:-1.3px;margin:0 0 6px;color:var(--text)}
.dashboard-hero p{font-size:12px;color:#70657a;line-height:1.6;margin:0;position:relative;z-index:2}
.dark .dashboard-hero p{color:#e0d2e8}
.hero-art{position:absolute;right:9px;top:-38px;height:210px;min-width:39%;display:flex;align-items:center;justify-content:center;pointer-events:none}
.hero-art:before{content:"";height:200px;width:250px;background:radial-gradient(ellipse at 50% 65%,#e0b5c9 0%,transparent 68%);position:absolute}
.hero-cat{font-size:100px;filter:drop-shadow(0 12px 10px #bc98ab55);position:relative;transform:rotate(-7deg);z-index:1}
.hero-books{font-size:75px;position:absolute;right:2px;top:78px;filter:drop-shadow(0 8px 6px #95759144)}
.hero-sparkles{position:absolute;left:12px;top:35px;font-size:65px;opacity:.6}
.hero-stats{position:absolute;left:12px;right:12px;bottom:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:9px;z-index:2}
.hero-stat{border-radius:10px;background:#fffdfddd;backdrop-filter:blur(7px);padding:10px 12px;display:flex;align-items:center;gap:11px;min-width:0}
.dark .hero-stat{background:#383244e0}
.hero-stat:nth-child(1){background:#ffebf4e8}.hero-stat:nth-child(2){background:#f2edffe8}.hero-stat:nth-child(3){background:#fff0f2e8}.hero-stat:nth-child(4){background:#e8f2ffe8}
.dark .hero-stat:nth-child(n){background:#41374be8}
.hero-stat i{font-size:19px;color:var(--accent);flex-shrink:0}
.hero-stat label{display:block;font-size:10px;color:#635b6b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-stat strong{display:block;font-size:13px;margin-top:2px;color:#242334}
.dark .hero-stat label,.dark .hero-stat strong{color:var(--text)}
.dash-columns{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(270px,.95fr);gap:12px;margin-bottom:12px}
.dash-bottom{display:grid;grid-template-columns:1.06fr 1.06fr 1fr;gap:12px;margin-bottom:12px}
.dash-tail{display:grid;grid-template-columns:1.05fr 1.3fr;gap:12px}
.dash-panel{padding:14px 15px;border-radius:15px;box-shadow:0 2px 12px #6f58700a;min-width:0}
.dash-panel .panelhead{margin-bottom:10px}
.dash-panel h2{font-size:13px;display:flex;align-items:center;gap:9px}
.dash-panel h2 i{color:var(--accent);font-size:18px}
.dash-panel .item{padding:9px 6px;border:0;border-bottom:1px solid var(--line);border-radius:0;font-size:11px}
.dash-panel .item:last-child{border-bottom:0}
.dash-panel .item .name{font-size:11px;line-height:1.35}
.dash-panel .item .meta{font-size:10px}
.dash-panel .pill{font-size:9px;padding:5px 8px;white-space:nowrap}
.dash-week-toolbar{display:flex;align-items:center;gap:8px}
.dash-week-toolbar button{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--card);color:var(--text)}
.timeline-scroll{overflow-x:auto}
.timeline{display:grid;grid-template-columns:37px repeat(7,minmax(72px,1fr));min-width:620px;position:relative}
.timeline-day{font-size:11px;text-align:center;min-height:41px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:5px 0}
.timeline-day strong{display:block}.timeline-day span{font-size:9px;color:var(--muted)}
.timeline-day.highlight{background:var(--pink)}
.timeline-hour{font-size:9px;color:var(--muted);height:39px;display:flex;justify-content:center;align-items:flex-start;padding-top:3px}
.timeline-cell{border-left:1px solid var(--line);border-top:1px solid var(--line);height:39px;min-width:0;position:relative}
.timeline-event{font-size:9px;line-height:1.4;background:var(--blue);border:1px solid #cde0f8;border-radius:5px;padding:4px;overflow:hidden;position:absolute;top:0;left:2px;right:2px;z-index:2;min-height:30px;color:#334158}
.timeline-event.school{background:#e3efff;border-color:#cae0ff}.timeline-event.homework{background:#fbe4f0;border-color:#f3cce0}.timeline-event.olympiad{background:#eee6ff;border-color:#daccff}.timeline-event.project{background:#e1f4e8;border-color:#c8e6d4}.timeline-event.course{background:#fff3d5;border-color:#f4e2ad}.timeline-event.personal{background:#efedf3;border-color:#e0dce9}
.timeline-event strong{display:block;font-weight:700}
.timeline-note{font-size:10px;color:var(--muted);margin-top:9px}
.deadline-dot{color:var(--accent);font-size:17px}
.dash-task{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line);font-size:11px}
.dash-task:last-child{border-bottom:0}
.dash-task input{accent-color:var(--accent)}
.dash-task .text{flex:1;min-width:0;line-height:1.35}
.dash-task.completed .text{text-decoration:line-through;color:var(--muted)}
.smallmeta{font-size:9px;color:var(--muted);margin-top:3px}
.mini-stat{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:10px}
.mini-chart{height:65px;display:flex;align-items:end;gap:7px;margin-top:11px}
.mini-chart .mini-column{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:9px}
.mini-chart .mini-column i{display:block;width:100%;max-width:34px;background:linear-gradient(#e6a1df,#eae2ff);border-radius:4px 4px 0 0;min-height:4px}
.quick-types{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.quick-types button{border:0;border-radius:8px;background:var(--bg);padding:9px 4px;font-size:10px;font-weight:650;color:var(--text);white-space:nowrap}
.quick-types button.active{background:var(--pink);color:#9d477b}
.quick-types i{font-size:13px;vertical-align:-2px;margin-right:4px}
.quick-line{display:flex;gap:8px;margin-top:7px}
.quick-line select{width:33%}
.quick-line .btn{white-space:nowrap}
.dash-panel .empty{padding:18px 10px}
@media(max-width:1180px){.dash-bottom{grid-template-columns:repeat(2,minmax(0,1fr))}.dash-bottom>.panel:last-child{grid-column:1/-1}.dash-columns{grid-template-columns:1.5fr 1fr}}
@media(max-width:940px){.dash-columns,.dash-tail{grid-template-columns:1fr}.hero-stats{grid-template-columns:repeat(2,1fr)}.dashboard-hero{min-height:220px}.hero-art{right:0;top:-12px}.hero-cat{font-size:80px}.hero-books{font-size:55px}}
@media(max-width:800px){.sidebar{overflow-x:auto}.sidebar:after{display:none}.brand{margin:0 0 7px}.content{padding:11px}.topbar{padding:0;gap:9px}.topbar-tools{gap:6px}.topbar .search-shell{max-width:none}.topbar kbd{display:none}}
@media(max-width:540px){.dashboard-hero{padding:19px 13px 110px;min-height:245px}.dashboard-hero h1{font-size:23px}.hero-art{right:5px;top:3px;opacity:.48}.hero-cat{font-size:70px}.hero-stats{gap:5px;left:7px;right:7px;bottom:8px}.hero-stat{padding:7px;gap:5px}.hero-stat i{font-size:14px}.hero-stat label{font-size:8px}.hero-stat strong{font-size:11px}.dash-bottom{grid-template-columns:1fr}.dash-bottom>.panel:last-child{grid-column:auto}.quick-types{grid-template-columns:repeat(2,1fr)}.quick-line{flex-wrap:wrap}.quick-line select{width:calc(50% - 4px)}.quick-line .btn{width:100%}}


/* illustrated spring refresh */
body{background:radial-gradient(circle at 98% 2%,#f8eaff 0,transparent 35%),radial-gradient(circle at 15% 65%,#ffe8f6 0,transparent 48%),var(--bg)}
body.dark{background:var(--bg)}
.sidebar{background:linear-gradient(180deg,#fffefd,#faf3ff 50%,#f4e1f3)}
.sidebar:after{content:"";inset:auto -12px -20px -30px;height:48%;width:calc(100% + 45px);background:url('assets/sakura-study.svg') 5% center/auto 100% no-repeat;opacity:.68;filter:saturate(1.1);transform:none;pointer-events:none}
.sidebar:before{content:"✿  ✧  ❀";position:absolute;bottom:39%;left:18px;color:#e8a6d0;opacity:.8;font-size:26px;letter-spacing:24px;pointer-events:none}
.dashboard-hero{background:#f6e5f4 url('assets/sakura-study.svg') center center/cover no-repeat;border:1px solid #edd4e8;box-shadow:0 10px 35px #c779a41c;min-height:215px;padding-top:23px}
.dashboard-hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#fcf1ffeb 0%,#fbeafbca 30%,#fbeafb18 65%,transparent 100%);pointer-events:none}
.dashboard-hero h1{position:relative;z-index:2;text-shadow:0 1px 2px #fff8;font-size:29px}
.dashboard-hero p{position:relative;z-index:2;font-weight:600}
.hero-art{display:none}
.hero-stats{bottom:12px}
.hero-stat{border:1px solid #ffffffa6;box-shadow:0 3px 14px #b8759b18;transition:transform .2s,box-shadow .2s}
.hero-stat:hover{transform:translateY(-3px);box-shadow:0 8px 20px #b8759b33}
.panel{transition:box-shadow .2s,border-color .2s}
.dash-panel{background:linear-gradient(160deg,var(--card) 65%,color-mix(in srgb,var(--pink) 20%,var(--card)));border:1px solid color-mix(in srgb,var(--accent) 12%,var(--line));box-shadow:0 5px 22px #8f668c0f}
.dash-panel:hover{box-shadow:0 10px 27px #a9679e1c;border-color:color-mix(in srgb,var(--accent) 26%,var(--line))}
.dash-panel .panelhead h2 i{background:var(--pink);padding:7px;border-radius:9px;font-size:16px}
.dash-panel .item:hover,.dash-task:hover{background:color-mix(in srgb,var(--pink) 18%,transparent);border-radius:9px}
.dash-panel .btn.primary{background:linear-gradient(110deg,#e9a2cc,var(--accent))}
.mini-chart .mini-column i{background:linear-gradient(180deg,#d978b0,#ebdcfb);border-radius:5px 5px 0 0}
.nav button.active{background:linear-gradient(100deg,#f9e1f2,#edddff);box-shadow:0 3px 12px #be93c41a}
.nav button{transition:background .2s,transform .2s}
.nav button:hover{transform:translateX(3px)}

document.addEventListener('change',e=>{if(e.target.id==='taskDate'){selected=e.target.value;render()}if(e.target.id==='importFile'){var f=e.target.files[0];if(!f)return;f.text().then(s=>{try{var o=JSON.parse(s);if(!o||!Array.isArray(o.tasks)||!Array.isArray(o.olympiads)){throw Error('Неподходящий файл')}if(!confirm('Заменить текущие данные резервной копией?'))return;db=Object.assign(JSON.parse(JSON.stringify(initial)),o);db.prefs=Object.assign({},initial.prefs,db.prefs||{});save();render();toast('Данные восстановлены')}catch(x){toast('Ошибка импорта: '+x.message)}})}});

document.addEventListener('click',function(e){
var q=e.target.closest('[data-quickkind]');if(q){quickKind=q.dataset.quickkind;document.querySelectorAll('[data-quickkind]').forEach(x=>x.classList.toggle('active',x===q));return}
var b=e.target.closest('[data-action]');if(!b)return;
if(b.dataset.action==='export:report'){exportReport();return}if(b.dataset.action==='print-report'){window.print();return}if(b.dataset.action==='clear-demo'){if(confirm('Удалить демонстрационные записи?')){['tasks','olympiads','courses','projects','events'].forEach(k=>db[k]=db[k].filter(x=>!String(x.id).startsWith('demo-')));db.demoMode=false;db.demoDismissed=true;save();render()}return}
if(b.dataset.action==='quickdash'){var input=$('quickText'),value=input&&input.value.trim();if(!value){toast('Напиши название');return}if(quickKind==='tasks'){var day=$('quickDate')&&$('quickDate').value==='tomorrow'?plus(today(),1):today(),category=$('quickCategory')&&$('quickCategory').value;var lower=value.toLowerCase(),match=lower.match(/до\s+(\d{1,2})\s+(января|февраля|марта|апреля|мая|июня|июля|августа|сентября|октября|ноября|декабря)/);var deadline='';if(match){var monthNum=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'].indexOf(match[2])+1,yr=Number(today().slice(0,4));deadline=yr+'-'+String(monthNum).padStart(2,'0')+'-'+String(match[1]).padStart(2,'0');if(deadline<today())deadline=(yr+1)+deadline.slice(4)}makeModal('tasks',null,{title:value,date:day,deadline:deadline,category:category,priority:'Средний'});}else makeModal(quickKind,null,{title:value,date:today()});return}
if(b.dataset.action.startsWith('week:')){selected=plus(selected,Number(b.dataset.action.slice(5)));render();return}
});
document.addEventListener('keydown',function(e){if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();var x=$('globalSearch');if(x)x.focus()}if(e.key==='Escape')closeModal()});
document.addEventListener('input',function(e){if(e.target.id!=='globalSearch')return;var q=e.target.value.trim().toLowerCase();if(q.length<2)return;var matches=['tasks','olympiads','projects','courses','notes','goals'].flatMap(kind=>db[kind].filter(r=>(r.title+' '+(r.category||'')+' '+(r.subject||'')).toLowerCase().includes(q)).map(r=>({kind:kind,record:r}))).slice(0,8);var old=$('searchPopup');if(old)old.remove();var box=document.createElement('div');box.id='searchPopup';box.style.cssText='position:absolute;z-index:20;top:53px;left:230px;width:min(560px,calc(100vw - 250px));background:var(--card);border:1px solid var(--line);border-radius:15px;padding:10px;box-shadow:0 20px 40px #2222';box.innerHTML=matches.length?matches.map(x=>'<button class="btn" style="display:flex;width:100%;justify-content:flex-start;margin:3px 0" data-search="'+x.kind+':'+esc(x.record.id)+'">'+esc(x.record.title)+' · '+esc(configs[x.kind].title)+'</button>').join(''):empty('Совпадений нет');document.body.append(box)});
document.addEventListener('click',function(e){var item=e.target.closest('[data-search]');if(item){var parts=item.dataset.search.split(':'),pop=$('searchPopup');if(pop)pop.remove();var inp=$('globalSearch');if(inp)inp.value='';makeModal(parts[0],parts[1])}else if(!e.target.closest('#globalSearch')&&!e.target.closest('#searchPopup')){var pop=$('searchPopup');if(pop)pop.remove()}});

render();
})();
</script></body></html>
