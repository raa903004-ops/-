function smart(){var raw=($('quickText')||{}).value||'';if(!raw.trim()){toast('Напиши, что нужно сделать');return}var lower=raw.toLowerCase(),months={'января':1,'февраля':2,'марта':3,'апреля':4,'мая':5,'июня':6,'июля':7,'августа':8,'сентября':9,'октября':10,'ноября':11,'декабря':12};var match=lower.match(/(?:до|на|к)\s+(\d{1,2})\s+(января|февраля|марта|апреля|мая|июня|июля|августа|сентября|октября|ноября|декабря)(?:\s+(\d{4}))?/);var deadline='';if(match){var year=Number(match[3]||today().slice(0,4)),candidate=year+'-'+String(months[match[2]]).padStart(2,'0')+'-'+String(match[1]).padStart(2,'0');if(!match[3]&&candidate<today())year++;deadline=year+'-'+String(months[match[2]]).padStart(2,'0')+'-'+String(match[1]).padStart(2,'0')}var reminder=lower.match(/напомни(?:ть)?\s+за\s+(\d+)\s+дн/);var category=/олимпиад|соревнован/.test(lower)?'Олимпиада':/домашн|дз|урок/.test(lower)?'Домашнее задание':/курс|лекци/.test(lower)?'Курс':/проект|исследован/.test(lower)?'Проект':'Школа';var name=raw.replace(/,?\s*напомни(?:ть)?\s+за\s+\d+\s+дн(?:я|ей|ь)?/i,'').trim();makeModal('tasks',null,{title:name,category:category,date:today(),deadline:deadline,reminder:reminder?reminder[1]:'',priority:'Средний'});toast('Проверь распознанные поля перед сохранением')}
